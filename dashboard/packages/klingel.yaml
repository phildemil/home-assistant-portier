# =====================================================================
#  Klingel – schlanke Türklingel nur mit Bordmitteln von Home Assistant
#  Ablage: /config/packages/klingel.yaml
#
#  VOR DEM EINSPIELEN ERSETZEN (Suchen & Ersetzen):
#    binary_sensor.klingel          -> dein Klingeltaster
#    camera.haustuer                -> deine Kamera
#    switch.tueroeffner             -> dein Türöffner-Relais
#    notify.mobile_app_handy        -> dein Handy (Android)
#    media_player.tablet_flur       -> browser_mod-Player, die klingeln sollen
#    media_player.handy_app
#    123456789                      -> Telegram-Chat-/Benutzer-IDs (2x unten)
# =====================================================================

# --- Helfer -----------------------------------------------------------
timer:
  # Läuft nach jedem Klingeln. Solange er läuft: Livebild auf dem
  # Dashboard und die "Tür öffnen"-Knöpfe in Push/Telegram gelten.
  klingel:
    name: Es klingelt
    icon: mdi:bell-ring
    duration: "00:03:00"
    restore: false

input_datetime:
  klingel_zuletzt:
    name: Zuletzt geklingelt
    icon: mdi:history
    has_date: true
    has_time: true

# --- Türöffner --------------------------------------------------------
script:
  klingel_tuer_oeffnen:
    alias: Tür öffnen
    icon: mdi:door-open
    mode: single
    max_exceeded: silent
    sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.tueroeffner
      - delay:
          seconds: 2
      - action: switch.turn_off
        target:
          entity_id: switch.tueroeffner

# --- Automationen -----------------------------------------------------
automation:
  - id: klingel_es_klingelt
    alias: "Klingel · Es klingelt"
    description: Livebild, Gong im Browser, Push und Telegram.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.klingel
        from: "off"
        to: "on"
    actions:
      - action: timer.start
        target:
          entity_id: timer.klingel
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.klingel_zuletzt
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: camera.snapshot
        continue_on_error: true
        target:
          entity_id: camera.haustuer
        data:
          filename: /config/www/klingel/letzter_besuch.jpg
      - parallel:
          # Gong in jedem offenen Browser / jeder offenen App (browser_mod)
          - action: media_player.play_media
            continue_on_error: true
            target:
              entity_id:
                - media_player.tablet_flur
                - media_player.handy_app
            data:
              media_content_id: /local/klingel/gong.mp3
              media_content_type: music
          # Push aufs Android-Handy
          - action: notify.mobile_app_handy
            continue_on_error: true
            data:
              title: Es klingelt
              message: "Jemand steht an der Haustür · {{ now().strftime('%H:%M') }}"
              data:
                image: "/local/klingel/letzter_besuch.jpg?v={{ now().timestamp() | int }}"
                tag: klingel
                channel: Türklingel
                importance: high
                priority: high
                ttl: 0
                clickAction: /dashboard-zuhause/uebersicht
                actions:
                  - action: KLINGEL_OEFFNEN
                    title: Tür öffnen
                  - action: URI
                    title: Livebild
                    uri: /dashboard-zuhause/uebersicht
          # Telegram mit Foto und Knopf
          - action: telegram_bot.send_photo
            continue_on_error: true
            data:
              file: /config/www/klingel/letzter_besuch.jpg
              caption: "🔔 Es klingelt · {{ now().strftime('%H:%M') }}"
              target:
                - 123456789
              inline_keyboard:
                - "🚪 Tür öffnen:/tuer_oeffnen"
      # Entprellung: 10 s lang wird ein erneutes Drücken ignoriert
      - delay:
          seconds: 10

  - id: klingel_oeffnen_push
    alias: "Klingel · Öffnen aus Push"
    mode: single
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: KLINGEL_OEFFNEN
    conditions:
      # Nur kurz nach dem Klingeln – alte Nachrichten öffnen nichts
      - condition: state
        entity_id: timer.klingel
        state: active
    actions:
      - action: script.klingel_tuer_oeffnen
      - action: notify.mobile_app_handy
        data:
          message: clear_notification
          data:
            tag: klingel

  - id: klingel_oeffnen_telegram
    alias: "Klingel · Öffnen aus Telegram"
    mode: single
    triggers:
      - trigger: event
        event_type: telegram_callback
        event_data:
          data: /tuer_oeffnen
    variables:
      # Nur diese Telegram-Benutzer dürfen öffnen
      erlaubt: [123456789]
    actions:
      - choose:
          - conditions:
              - "{{ trigger.event.data.user_id in erlaubt }}"
              - condition: state
                entity_id: timer.klingel
                state: active
            sequence:
              - action: script.klingel_tuer_oeffnen
              - action: telegram_bot.answer_callback
                data:
                  callback_query_id: "{{ trigger.event.data.id }}"
                  message: "Tür ist offen 🚪"
          - conditions:
              - "{{ trigger.event.data.user_id in erlaubt }}"
            sequence:
              - action: telegram_bot.answer_callback
                data:
                  callback_query_id: "{{ trigger.event.data.id }}"
                  message: "Zu spät – dieses Klingeln ist abgelaufen."
                  show_alert: true
        default:
          - action: telegram_bot.answer_callback
            data:
              callback_query_id: "{{ trigger.event.data.id }}"
              message: "Nicht erlaubt."

  - id: klingel_tuer_zu_nach_start
    alias: "Klingel · Türöffner nach Neustart aus"
    description: Falls HA mitten im Öffnen neu gestartet ist.
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.tueroeffner

