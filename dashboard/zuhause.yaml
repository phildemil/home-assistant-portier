# Dashboard "Zuhause"
# Einfügen: Dashboard öffnen -> Stift (Bearbeiten) -> ⋮ -> Raw-Konfigurationseditor
# Platzhalter-Entitäten ersetzen (Liste im README).

title: Zuhause
views:
  # ===================================================================
  #  ÜBERSICHT – von allem ein bisschen
  # ===================================================================
  - title: Übersicht
    path: uebersicht
    icon: mdi:home-heart
    type: sections
    theme: Cosy
    max_columns: 3
    header:
      layout: start
      badges_position: bottom
      card:
        type: markdown
        text_only: true
        content: |-
          {%- set h = now().hour -%}
          {%- if h < 5 or h >= 23 %}{% set gruss = 'Gute Nacht' %}
          {%- elif h < 11 %}{% set gruss = 'Guten Morgen' %}
          {%- elif h < 17 %}{% set gruss = 'Schönen Tag' %}
          {%- else %}{% set gruss = 'Guten Abend' %}{% endif -%}
          # {{ gruss }}

          {% if is_state('timer.klingel', 'active') -%}
          🔔 **Es klingelt gerade an der Haustür.**
          {%- else -%}
          {%- set w = states('weather.forecast_home') -%}
          {%- set f = states('sensor.dachfenster_offen') | int(0) -%}
          {%- set regen = w in ['rainy', 'pouring', 'lightning-rainy', 'hail', 'snowy-rainy'] -%}
          {%- if f > 0 and regen -%}
          **Es regnet und {{ f }} Dachfenster {{ 'ist' if f == 1 else 'sind' }} offen!**
          {%- elif f > 0 -%}
          {{ f }} Dachfenster {{ 'ist' if f == 1 else 'sind' }} offen
          {%- else -%}
          Alles ruhig zu Hause
          {%- endif %}
          {%- endif %}
    badges:
      - type: entity
        entity: timer.klingel
        name: Es klingelt
        show_name: true
        show_state: false
        color: deep-orange
        visibility:
          - condition: state
            entity: timer.klingel
            state: active
      - type: entity
        entity: weather.forecast_home
        show_name: false
        state_content:
          - state
          - temperature
        tap_action:
          action: more-info
      - type: entity
        entity: sensor.temperatur_innen
        name: Innen
        show_name: true
        icon: mdi:home-thermometer-outline
    sections:
      # --- Kameras mit Knöpfen im Bild ----------------------------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Draußen
            icon: mdi:cctv
            tap_action:
              action: navigate
              navigation_path: /dashboard-zuhause/kameras
          # Beim Klingeln: Haustür groß und live
          - type: picture-glance
            title: Es klingelt
            camera_image: camera.haustuer
            camera_view: live
            aspect_ratio: "16:9"
            grid_options:
              columns: full
              rows: auto
            tap_action:
              action: more-info
            entities: &haustuer_knoepfe
              - entity: script.klingel_tuer_oeffnen
                name: Tür öffnen
                icon: mdi:door-open
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: script.klingel_tuer_oeffnen
                  confirmation:
                    text: Haustür jetzt öffnen?
              - entity: camera.haustuer
                name: Klingel
                icon: mdi:history
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-zuhause/klingel
            visibility:
              - condition: state
                entity: timer.klingel
                state: active
          # Sonst: beide Kameras nebeneinander
          - type: picture-glance
            title: Haustür
            camera_image: camera.haustuer
            camera_view: auto
            aspect_ratio: "16:10"
            grid_options:
              columns: 12
              rows: auto
            tap_action:
              action: more-info
            entities: *haustuer_knoepfe
            visibility:
              - condition: state
                entity: timer.klingel
                state_not: active
          - type: picture-glance
            title: Garten
            camera_image: camera.garten
            camera_view: auto
            aspect_ratio: "16:10"
            grid_options:
              columns: 12
              rows: auto
            tap_action:
              action: more-info
            entities:
              - entity: light.terrasse
                name: Terrasse
              - entity: light.garten
                name: Garten
            visibility:
              - condition: state
                entity: timer.klingel
                state_not: active

      # --- Balkonkraftwerk ---------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Sonne & Akku
            icon: mdi:solar-power-variant
            tap_action:
              action: navigate
              navigation_path: /dashboard-zuhause/energie
          - type: gauge
            entity: sensor.akku_ladestand
            name: Akku
            needle: false
            min: 0
            max: 100
            severity:
              red: 0
              yellow: 20
              green: 50
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: sensor.balkonkraftwerk_leistung
            name: Solar jetzt
            icon: mdi:solar-power-variant
            color: amber
            vertical: true
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: sensor.balkonkraftwerk_ertrag_heute
            name: Heute geerntet
            icon: mdi:white-balance-sunny
            color: amber
            grid_options:
              columns: full

      # --- Räume -------------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Räume
            icon: mdi:sofa-outline
            badges:
              - type: entity
                entity: sensor.lichter_an
                name: Lichter an
                show_state: true
                show_icon: true
                color: amber
                tap_action:
                  action: perform-action
                  perform_action: light.turn_off
                  target:
                    entity_id: light.alle_lichter
                  confirmation:
                    text: Alle Lichter ausschalten?
                visibility:
                  - condition: numeric_state
                    entity: sensor.lichter_an
                    above: 0
              - type: entity
                entity: sensor.dachfenster_offen
                name: Dachfenster offen
                show_state: true
                show_icon: true
                color: orange
                tap_action:
                  action: perform-action
                  perform_action: cover.close_cover
                  target:
                    entity_id: cover.alle_dachfenster
                  confirmation:
                    text: Alle Dachfenster schließen?
                visibility:
                  - condition: numeric_state
                    entity: sensor.dachfenster_offen
                    above: 0
          - type: tile
            entity: light.wohnzimmer_decke
            name: Deckenlicht
            icon: mdi:ceiling-light
            features_position: inline
            features:
              - type: light-brightness
            grid_options:
              columns: 6
          - type: tile
            entity: light.esstisch
            name: Esstisch
            icon: mdi:table-chair
            features_position: inline
            features:
              - type: light-brightness
            grid_options:
              columns: 6
          - type: tile
            entity: light.alle_lichter
            name: Alle Lichter
            icon: mdi:lightbulb-group
            features_position: inline
            features:
              - type: light-brightness
            grid_options:
              columns: 6
          - &raum
            type: area
            area: wohnzimmer
            display_type: compact
            sensor_classes: [temperature]
            alert_classes: [window, door, moisture]
            features_position: inline
            features:
              - type: area-controls
                controls: [light, cover-shutter, cover-window]
            grid_options:
              columns: 6
          - {<<: *raum, area: kuche}
          - {<<: *raum, area: schlafzimmer}
          - {<<: *raum, area: kinderzimmer}
          - {<<: *raum, area: buro}
          - {<<: *raum, area: bad}
          - {<<: *raum, area: flur}
          - {<<: *raum, area: garten}

  # ===================================================================
  #  LICHT – alle 15 Aktoren nach Räumen
  # ===================================================================
  - title: Licht
    path: licht
    icon: mdi:lightbulb-group-outline
    type: sections
    theme: Cosy
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Wohnen
          - type: tile
            entity: light.wohnzimmer_decke
            name: Decke
            features: [{type: light-brightness}]
            grid_options: {columns: full}
          - type: tile
            entity: light.wohnzimmer_stehlampe
            name: Stehlampe
            features: [{type: light-brightness}]
            grid_options: {columns: full}
          - type: tile
            entity: light.esstisch
            name: Esstisch
            features: [{type: light-brightness}]
            grid_options: {columns: full}
          - type: tile
            entity: switch.steckdose_tv
            name: TV-Steckdose
            icon: mdi:television
            grid_options: {columns: full}
      - type: grid
        cards:
          - type: heading
            heading: Küche
          - type: tile
            entity: light.kueche
            name: Decke
            features: [{type: light-brightness}]
            grid_options: {columns: full}
          - type: tile
            entity: light.kueche_unterbau
            name: Unterbau
            features: [{type: light-brightness}]
            grid_options: {columns: full}
          - type: tile
            entity: switch.kaffeemaschine
            name: Kaffeemaschine
            icon: mdi:coffee-maker-outline
            grid_options: {columns: full}
      - type: grid
        cards:
          - type: heading
            heading: Schlafen & Arbeiten
          - type: tile
            entity: light.schlafzimmer
            name: Schlafzimmer
            features: [{type: light-brightness}]
            grid_options: {columns: full}
          - type: tile
            entity: light.kinderzimmer
            name: Kinderzimmer
            features: [{type: light-brightness}]
            grid_options: {columns: full}
          - type: tile
            entity: light.buero
            name: Büro
            features: [{type: light-brightness}]
            grid_options: {columns: full}
      - type: grid
        cards:
          - type: heading
            heading: Flur & Bad
          - type: tile
            entity: light.flur
            name: Flur
            grid_options: {columns: full}
          - type: tile
            entity: light.bad
            name: Bad
            grid_options: {columns: full}
          - type: heading
            heading: Draußen
          - type: tile
            entity: light.terrasse
            name: Terrasse
            grid_options: {columns: full}
          - type: tile
            entity: light.garten
            name: Garten
            grid_options: {columns: full}
          - type: tile
            entity: switch.lichterkette
            name: Lichterkette
            icon: mdi:string-lights
            grid_options: {columns: full}

  # ===================================================================
  #  ROLLOS & DACHFENSTER
  # ===================================================================
  - title: Rollos & Fenster
    path: fenster
    icon: mdi:blinds-horizontal
    type: sections
    theme: Cosy
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Rollos
            icon: mdi:blinds-horizontal
          - type: tile
            entity: cover.alle_rollos
            name: Alle
            color: primary
            features_position: inline
            features: [{type: cover-open-close}]
            grid_options: {columns: full}
          - &rollo
            type: tile
            entity: cover.rollo_wohnzimmer
            name: Wohnzimmer
            color: primary
            features_position: inline
            features: [{type: cover-open-close}]
            grid_options: {columns: full}
          - {<<: *rollo, entity: cover.rollo_kueche, name: Küche}
          - {<<: *rollo, entity: cover.rollo_schlafzimmer, name: Schlafzimmer}
          - {<<: *rollo, entity: cover.rollo_kinderzimmer, name: Kinderzimmer}
          - {<<: *rollo, entity: cover.rollo_buero, name: Büro}
      - type: grid
        cards:
          - type: heading
            heading: Dachfenster
            icon: mdi:window-shutter-open
          - type: tile
            entity: cover.alle_dachfenster
            name: Alle
            color: primary
            features_position: inline
            features: [{type: cover-open-close}]
            grid_options: {columns: full}
          - &dach
            type: tile
            entity: cover.dachfenster_bad
            name: Bad
            color: primary
            features_position: inline
            features: [{type: cover-open-close}]
            grid_options: {columns: full}
          - {<<: *dach, entity: cover.dachfenster_flur, name: Flur}
          - {<<: *dach, entity: cover.dachfenster_schlafzimmer, name: Schlafzimmer}
          - {<<: *dach, entity: cover.dachfenster_kinderzimmer, name: Kinderzimmer}
          - {<<: *dach, entity: cover.dachfenster_buero, name: Büro}

  # ===================================================================
  #  KAMERAS
  # ===================================================================
  - title: Kameras
    path: kameras
    icon: mdi:cctv
    type: sections
    theme: Cosy
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Haustür
          - type: picture-entity
            entity: camera.haustuer
            camera_view: live
            show_state: false
            show_name: false
            aspect_ratio: "16:9"
            grid_options: {columns: full}
      - type: grid
        cards:
          - type: heading
            heading: Garten
          - type: picture-entity
            entity: camera.garten
            camera_view: live
            show_state: false
            show_name: false
            aspect_ratio: "16:9"
            grid_options: {columns: full}

  # ===================================================================
  #  ENERGIE – Balkonkraftwerk mit Akku
  # ===================================================================
  - title: Energie
    path: energie
    icon: mdi:solar-power-variant
    type: sections
    theme: Cosy
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Jetzt
          - type: tile
            entity: sensor.balkonkraftwerk_leistung
            name: Solar
            icon: mdi:solar-power-variant
            color: amber
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.akku_leistung
            name: Akku jetzt
            icon: mdi:battery-charging
            color: green
            grid_options: {columns: 6}
          - type: gauge
            entity: sensor.akku_ladestand
            name: Akku
            min: 0
            max: 100
            needle: false
            severity:
              red: 0
              yellow: 20
              green: 50
            grid_options: {columns: 6, rows: 2}
          - type: tile
            entity: sensor.balkonkraftwerk_ertrag_heute
            name: Ertrag heute
            icon: mdi:white-balance-sunny
            color: amber
            vertical: true
            grid_options: {columns: 6, rows: 2}
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Heute
          - type: history-graph
            hours_to_show: 24
            grid_options: {columns: full}
            entities:
              - entity: sensor.balkonkraftwerk_leistung
                name: Solar
              - entity: sensor.akku_leistung
                name: Akku
          - type: history-graph
            hours_to_show: 24
            grid_options: {columns: full}
            entities:
              - entity: sensor.akku_ladestand
                name: Akku-Ladestand

  # ===================================================================
  #  KLINGEL – Detailseite
  # ===================================================================
  - title: Klingel
    path: klingel
    icon: mdi:doorbell-video
    type: sections
    theme: Cosy
    max_columns: 3
    dense_section_placement: false
    badges:
      - type: entity
        entity: timer.klingel
        name: Es klingelt
        show_name: true
        show_state: false
        show_icon: true
        color: deep-orange
        tap_action:
          action: none
        visibility:
          - condition: state
            entity: timer.klingel
            state: active
    sections:
      # ---------------------------------------------------------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Haustür
            heading_style: title
            icon: mdi:door
          # Beim Klingeln: Livebild
          - type: picture-entity
            entity: camera.haustuer
            camera_view: live
            show_name: false
            show_state: false
            aspect_ratio: "16:9"
            grid_options:
              columns: full
            tap_action:
              action: more-info
            visibility:
              - condition: state
                entity: timer.klingel
                state: active
          # Sonst: ruhiges Standbild
          - type: picture-entity
            entity: camera.haustuer
            camera_view: auto
            show_name: false
            show_state: false
            aspect_ratio: "16:9"
            grid_options:
              columns: full
            tap_action:
              action: more-info
            visibility:
              - condition: state
                entity: timer.klingel
                state_not: active
          - type: tile
            entity: script.klingel_tuer_oeffnen
            name: Tür öffnen
            icon: mdi:door-open
            color: primary
            show_entity_picture: false
            vertical: false
            hide_state: true
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: perform-action
              perform_action: script.klingel_tuer_oeffnen
              confirmation:
                text: Haustür jetzt öffnen?
            icon_tap_action:
              action: perform-action
              perform_action: script.klingel_tuer_oeffnen
              confirmation:
                text: Haustür jetzt öffnen?
          - type: tile
            entity: camera.haustuer
            name: Livebild groß
            icon: mdi:cctv
            color: amber
            hide_state: true
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info

      # ---------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Letzter Besuch
            heading_style: title
            icon: mdi:account-clock-outline
          - type: picture-entity
            entity: camera.klingel_letzter_besuch
            show_name: false
            show_state: false
            aspect_ratio: "16:9"
            grid_options:
              columns: full
            tap_action:
              action: more-info
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: >-
              {% set z = states('input_datetime.klingel_zuletzt') %}
              {% if z in ['unknown', 'unavailable', ''] -%}
              Noch niemand da gewesen.
              {%- else -%}
              {% set t = as_datetime(z) | as_local %}
              {% set tage = (now().date() - t.date()).days %}
              {% if tage == 0 %}Heute{% elif tage == 1 %}Gestern{% else %}Am {{ t.strftime('%d.%m.%Y') }}{% endif %}
              um **{{ t.strftime('%H:%M') }}** Uhr
              {%- endif %}
          - type: heading
            heading: Verlauf
            heading_style: subtitle
          - type: logbook
            target:
              entity_id:
                - automation.klingel_es_klingelt
                - script.klingel_tuer_oeffnen
            hours_to_show: 48
            grid_options:
              columns: full
